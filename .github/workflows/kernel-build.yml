name: Kernel module build

on:
  push:
    branches: [kernel-7-compat]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build-only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential kmod linux-headers-generic
      - name: Select available headers
        id: kernel
        shell: bash
        run: |
          set -euo pipefail
          kernel="$(find /lib/modules -mindepth 2 -maxdepth 2 -name build -printf '%h\n' | sed 's#^/lib/modules/##' | sort -V | tail -1)"
          test -n "$kernel"
          test -e "/lib/modules/$kernel/build/Makefile"
          echo "version=$kernel" >> "$GITHUB_OUTPUT"
          echo "Building against $kernel"
      - name: Compile module without installing
        shell: bash
        run: |
          set -euo pipefail
          make modules BSRC="/lib/modules/${{ steps.kernel.outputs.version }}" 2>&1 | tee build.log
          test -s src/r8125.ko
          modinfo src/r8125.ko | grep '^vermagic:' | grep -F "${{ steps.kernel.outputs.version }}"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: build.log
          if-no-files-found: ignore
