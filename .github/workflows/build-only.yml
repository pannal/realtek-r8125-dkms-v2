name: Build only (no hardware tests)

on:
  push:
    branches: [realtek-9.018-optimized]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }} / ${{ matrix.headers }} / PTP ${{ matrix.ptp }} (compile only)
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '22.04'
            headers: linux-headers-generic
            compiler: gcc-11
            ptp: n
          - ubuntu: '24.04'
            headers: linux-headers-generic
            compiler: gcc-13
            ptp: n
          - ubuntu: '26.04'
            headers: linux-headers-generic
            compiler: gcc-15
            ptp: n
          - ubuntu: '26.04'
            headers: linux-headers-7.0.0-38-generic
            compiler: gcc-15
            ptp: y
    steps:
      - name: Install build tools and headers in disposable CI container
        env:
          DEBIAN_FRONTEND: noninteractive
          HEADERS_PACKAGE: ${{ matrix.headers }}
          COMPILER_PACKAGE: ${{ matrix.compiler }}
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates git make binutils libc6-dev python3 kmod \
            "$COMPILER_PACKAGE" "$HEADERS_PACKAGE"
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Exercise host-side failure paths (mock kernel services)
        env:
          CC: ${{ matrix.compiler }}
        run: python3 tests/test_driver_paths.py
      - name: Compile and inspect module only
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
          ENABLE_PTP_SUPPORT: ${{ matrix.ptp }}
        run: |
          set -euo pipefail
          kdir=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-*-generic' | sort -V | tail -1)
          test -n "$kdir"
          scripts/build-only.sh "$kdir" build
      - name: Retain compile evidence and uninstalled module
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compile-only-ubuntu-${{ matrix.ubuntu }}-${{ matrix.headers }}-ptp-${{ matrix.ptp }}
          path: build/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Ubuntu 26.04 unsigned package checks (no installation)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install packaging tools in disposable CI container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates git build-essential debhelper dh-dkms python3 lintian
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build unsigned source and binary packages
        run: scripts/build-packages.sh packages
      - name: Inspect real artifacts and generated maintainer scripts
        run: |
          python3 tests/test_package_artifacts.py packages
          lintian --allow-root packages/*_amd64.changes packages/*_source.changes
